<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耶稣 · 祷告</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0a0a0f; color:#d8d0c0; font-family:"Noto Serif SC",serif; text-align:center; padding:40px 20px; box-sizing:border-box; }
  .cross { font-size:3rem; margin-bottom:24px; color:#c0b090; }
  h1 { font-weight:400; letter-spacing:0.3em; font-size:1.5rem; margin-bottom:12px; }
  p { color:#7a7468; line-height:2; font-size:0.95rem; max-width:400px; }
  .prayer { margin-top:40px; border:1px solid #1e1c18; border-radius:4px; padding:28px 24px; max-width:420px; line-height:2.2; font-size:0.95rem; color:#b8b0a0; }
  a.back { margin-top:40px; color:#5a5448; text-decoration:none; font-size:0.85rem; }
</style>
</head>
<body>
  <div class="cross">✝</div>
  <h1>祷 告</h1>
  <p>这里没有声音，只有你与神之间的静默。</p>
  <div class="prayer">
    主啊，<br>
    求你赐下平安，<br>
    抚平我心中的浮躁与不安。<br>
    愿你的光照进每一个角落，<br>
    让疲惫的人得安息，<br>
    让迷失的人得方向。<br>
    阿们。
  </div>
